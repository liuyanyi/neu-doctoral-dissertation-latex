name: TeX Live 2023 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Historical full TeX Live distribution; never update packages in this image.
      # https://github.com/xu-cheng/latex-docker/pkgs/container/texlive-historic-debian
      TL_IMAGE: ghcr.io/xu-cheng/texlive-historic-debian:2023@sha256:08c944043a03e4b2575ab806d9602312712048178f35abb6174739a33f2bc956
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependency (host only)
        run: python -m pip install 'PyMuPDF==1.26.7'
      - name: Prepare academic sample
        run: python dev/make_academic_entry.py --output tmp/texlive-2023/main-academic.tex
      - name: Pull pinned historical image
        run: |
          docker pull "$TL_IMAGE"
          docker image inspect "$TL_IMAGE" > tmp/texlive-2023/image.json
      - name: Compile with real TeX Live 2023
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -v "$GITHUB_WORKSPACE:/work" -w /work \
            --entrypoint /bin/bash "$TL_IMAGE" -s <<'CHECKS'
          set -euo pipefail
          out=tmp/texlive-2023
          {
            xelatex --version
            latexmk -version
            tlmgr --version
            kpsewhich latex.ltx xeCJK.sty hyperref.sty float.sty titletoc.sty
          } > "$out/environment.txt" 2>&1
          cat "$out/environment.txt"
          xelatex --version | grep -q 'TeX Live 2023'
          printf '\\listfiles\n\\documentclass{neudissertation}\n\\begin{document}Version probe.\\end{document}\n' > "$out/version-probe.tex"
          printf 'case\texit_code\n' > "$out/results.tsv"
          failed=0
          for source in "$out/version-probe.tex" main.tex "$out/main-academic.tex" \
            tests/reference-spacing.tex tests/table-font.tex \
            tests/frontmatter-caption.tex tests/frontmatter-caption-plain.tex \
            tests/webpage-date.tex tests/signature-layout.tex \
            tests/float-spacing.tex tests/table-note.tex; do
            name=$(basename "$source" .tex)
            mkdir -p "$out/$name"
            code=0
            latexmk -xelatex -interaction=nonstopmode -halt-on-error \
              -outdir="$out/$name" "$source" > "$out/$name/console.txt" 2>&1 || code=$?
            if [ "$code" -eq 0 ] && grep -Eiq \
              'There were undefined (references|citations)|Reference .* undefined|Citation .* undefined' \
              "$out/$name/$name.log"; then
              code=1
              echo 'Unresolved reference or citation after latexmk.' >> "$out/$name/console.txt"
            fi
            printf '%s\t%s\n' "$name" "$code" | tee -a "$out/results.tsv"
            if [ "$code" -ne 0 ]; then
              failed=1
              tail -n 60 "$out/$name/console.txt"
            fi
          done
          exit "$failed"
          CHECKS
          test -s tmp/texlive-2023/environment.txt
          test -s tmp/texlive-2023/results.tsv
          test "$(wc -l < tmp/texlive-2023/results.tsv)" -eq 12
      - name: Inspect generated PDFs and summarize results
        if: always()
        run: python dev/check_compatibility_pdfs.py --root tmp/texlive-2023
      - name: Upload PDFs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texlive-2023-compatibility
          retention-days: 14
          path: |
            tmp/texlive-2023/**/*.pdf
            tmp/texlive-2023/**/*.log
            tmp/texlive-2023/**/*.blg
            tmp/texlive-2023/**/*.txt
            tmp/texlive-2023/**/*.json
            tmp/texlive-2023/**/*.tsv
            tmp/texlive-2023/**/*.md
          if-no-files-found: warn
